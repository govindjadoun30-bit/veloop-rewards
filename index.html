<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#050505"
  >

  <meta
    name="description"
    content="VELOOP Rewards — Earn XP, collect VEs and level up."
  >

  <title>VELOOP Rewards</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <div class="app-shell">

    <!-- TOP BAR -->
    <header class="topbar">

      <button
        class="icon-btn"
        id="menuBtn"
        type="button"
        aria-label="Menu"
      >
        ☰
      </button>


      <div class="brand">

        <div class="logo-mark">
          V
        </div>

        <div class="brand-name">
          VELOOP
        </div>

      </div>


      <button
        class="icon-btn notification"
        id="notifyBtn"
        type="button"
        aria-label="Notifications"
      >

        ♧

        <span class="notification-dot"></span>

      </button>

    </header>


    <!-- MAIN APP -->
    <main
      id="app"
      class="app-content">
    </main>


    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">

      <button
        class="nav-item active"
        data-route="home"
        type="button"
      >
        <span class="nav-icon">⌂</span>
        <span class="nav-label">Home</span>
      </button>


      <button
        class="nav-item"
        data-route="earn"
        type="button"
      >
        <span class="nav-icon">$</span>
        <span class="nav-label">Earn</span>
      </button>


      <button
        class="nav-item"
        data-route="rewards"
        type="button"
      >
        <span class="nav-icon">♛</span>
        <span class="nav-label">Rewards</span>
      </button>


      <button
        class="nav-item"
        data-route="wallet"
        type="button"
      >
        <span class="nav-icon">◈</span>
        <span class="nav-label">Wallet</span>
      </button>


      <button
        class="nav-item"
        data-route="profile"
        type="button"
      >
        <span class="nav-icon">●</span>
        <span class="nav-label">Profile</span>
      </button>

    </nav>

  </div>


  <!-- GLOBAL MODAL -->
  <div
    class="modal-layer"
    id="modalLayer"
  >

    <div
      class="modal-backdrop"
      id="modalBackdrop"
    ></div>

    <div
      class="modal-box"
      id="modalBox"
    ></div>

  </div>


  <!-- TOAST -->
  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>


  <script src="script.js"></script>

</body>

</html>
