<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#fffaf0">

  <meta name="description"
        content="VELOOP Rewards — earn XP, collect VEs and unlock rewards.">

  <title>VELOOP Rewards</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app-shell">

    <!-- TOP BAR -->
    <header class="topbar">

      <button
        class="icon-btn"
        id="menuBtn"
        type="button"
        aria-label="Menu">
        ☰
      </button>

      <div class="brand">
        <span class="logo-mark">V</span>
        <span class="brand-name">VELOOP</span>
      </div>

      <button
        class="icon-btn notification"
        id="notifyBtn"
        type="button"
        aria-label="Notifications">

        ♧
        <span class="notification-dot"></span>

      </button>

    </header>


    <!-- APP -->
    <main id="app" class="app-content"></main>


    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">

      <button
        class="nav-item active"
        data-route="home"
        type="button">

        <span class="nav-icon">⌂</span>
        <span class="nav-label">Home</span>

      </button>

      <button
        class="nav-item"
        data-route="earn"
        type="button">

        <span class="nav-icon">$</span>
        <span class="nav-label">Earn</span>

      </button>

      <button
        class="nav-item"
        data-route="rewards"
        type="button">

        <span class="nav-icon">🎁</span>
        <span class="nav-label">Rewards</span>

      </button>

      <button
        class="nav-item"
        data-route="wallet"
        type="button">

        <span class="nav-icon">▣</span>
        <span class="nav-label">Wallet</span>

      </button>

      <button
        class="nav-item"
        data-route="profile"
        type="button">

        <span class="nav-icon">●</span>
        <span class="nav-label">Profile</span>

      </button>

    </nav>

  </div>


  <!-- TOAST -->
  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite">
  </div>


  <script src="script.js"></script>

</body>
</html>
